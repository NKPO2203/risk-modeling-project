# Relance les tests et le contrôle des empreintes de l'étape 2 à chaque envoi.
# Le corpus SEC de l'étape 1 n'est pas dans le dépôt : ses deux tests sont ignorés.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m src.construire_portefeuilles --check-only
